          maximum: 100
        offset:
          type: integer
          minimum: 0
      example:
        items:
          - id: 6c72da79-7c19-49a9-95c9-18d979051b3f
            name: Alpha
            slug: alpha-a6c1e2f31148b902
            role: owner
            created_at: "2026-10-20T12:00:00Z"
