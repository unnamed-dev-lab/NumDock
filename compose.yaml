services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: numdock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: numdock
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numdock -d numdock"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
