  /healthz:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      description: Returns 200 while the API process is running. It does not check PostgreSQL.
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: Pings PostgreSQL with a one-second timeout. Use this for load balancers and orchestrators.
      responses:
        "200":
          description: Database is reachable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/openapi.yaml:
    get:
      tags: [Documentation]
      operationId: getOpenAPIDocument
      summary: Download the OpenAPI contract
      description: Returns the same OpenAPI document used by the Scalar reference at `/docs/api`.
      responses:
        "200":
          description: OpenAPI 3.0 YAML document.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/yaml:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/auth/csrf:
    get:
      tags: [Identity]
      operationId: getCSRFToken
      summary: Get a CSRF token
      description: |
        Returns a CSRF token and sets the matching HttpOnly CSRF cookie.
        Reuse the existing cookie token when it is still valid. The token is
        also required in `X-CSRF-Token` for register, login, and logout.
      responses:
        "200":
          description: CSRF token and cookie.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFToken"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/auth/register:
    post:
      tags: [Identity]
      operationId: register
      summary: Create an account and workspace
      description: |
        Creates a user, an organization, an owner membership, and a session in
        one PostgreSQL transaction. The previous session cookie, when present,
        is revoked. The new session cookie is only set after the transaction
        commits. The browser must send an `Origin` header that exactly matches
        `APP_ORIGIN`.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "201":
          description: Account, organization, owner membership, and session created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/auth/login:
    post:
      tags: [Identity]
      operationId: login
      summary: Sign in and rotate the session
      description: |
        Verifies the email and password, revokes the presented session cookie
        when present, creates a new session, and returns the current identity.
        Missing accounts still perform a dummy password hash to reduce timing
        differences. The browser must send an `Origin` header that exactly
        matches `APP_ORIGIN`.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in; prior session cookie is rotated and revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      summary: Revoke the current session
      description: |
        Requires a valid session and CSRF token. The session hash is deleted
        from PostgreSQL and the browser session cookie is cleared. The browser
        must send an `Origin` header that exactly matches `APP_ORIGIN`.
      security:
        - Session: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Session revoked and cookie cleared.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/me:
    get:
      tags: [Identity]
      operationId: getIdentity
      summary: Get the current identity
