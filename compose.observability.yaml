# Local-only development observability. Independent of the database compose file.
name: numdock-observability
services:
  lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "127.0.0.1:4300:3000"
      - "127.0.0.1:4318:4318"
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/numdock/api.json
    volumes:
      - lgtm-data:/data
      - ./observability/dashboards/api.json:/otel-lgtm/grafana/conf/provisioning/dashboards/numdock/api.json:ro
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/numdock.yaml:ro
volumes:
  lgtm-data:
