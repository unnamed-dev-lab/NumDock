  /v1/catalog/numbers:
    get:
      tags: [Catalog]
      operationId: listCatalogNumbers
      summary: List the development number catalog
      description: |
        Public read-only catalog of available inventory and prices. Leased and quarantined resources are excluded. Only APP_ENV=development exposes seeded
        mock inventory; all other modes return an empty list with mode=disabled,
        even if fixture rows exist. Mock numbers and prices are synthetic and
        can only be leased and tested using authenticated development operations. No live provider is connected.
        Filters combine with AND. Search is a case-insensitive literal substring
        over number, country name, region, and provider (not SQL wildcards).
        Ordering is stable with an ID tie-breaker. Total counts all matching rows.
        Unknown and repeated query parameters are rejected.
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: country
          in: query
          schema: { type: string, pattern: "^[A-Z]{2}$" }
          description: Two-letter uppercase country code, for example US or CA.
        - name: number_type
          in: query
          schema: { type: string, enum: [mobile, local, toll_free] }
        - name: capability
          in: query
          schema: { type: string, enum: [sms, voice, mms] }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum: [e164, monthly_fee_minor, inbound_sms_fee_micros],
              default: e164,
            }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Mock catalog in development, or disabled catalog elsewhere.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/organizations/{organization_id}/overview:
    get:
      tags: [Overview]
      operationId: getOrganizationOverview
      summary: Read an organization overview
      description: |
        Requires a valid session and membership in the requested organization.
        Missing organizations and organizations outside the user's memberships
        both return 404. Development samples are isolated from real transactions.
        Only APP_ENV=development reads development_overview_daily. Production
        returns mode=disabled with no samples, even against a seeded database.
        mode=empty means no samples in the selected UTC window. mode=mock means
        an explicitly synthetic dashboard, not provider health or a real wallet.
        Counts and spend are summed over the selected UTC days; active_numbers
        is the latest recorded snapshot, never a sum. Missing days are zero-filled.
        Telemetry flags describe SDK/export configuration, not collector health.
        Unknown/repeated query parameters are rejected.
      security:
        - Session: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30], default: 30 }
      responses:
        "200":
          description: Authorized overview and telemetry configuration flags.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
