components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: numdock_session
      description: |
        HttpOnly session cookie. Secure deployments use the
        `__Host-numdock_session` name. Browser clients must send cookies and
        must not store the session token in localStorage.
  parameters:
    Origin:
      name: Origin
      in: header
      required: false
      description: |
        Browser requests send this header automatically; non-browser clients
        must send an Origin that exactly matches the backend `APP_ORIGIN`.
      schema:
        type: string
        format: uri
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token returned by `GET /v1/auth/csrf`; must match the CSRF cookie.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Number of items to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
  headers:
    XRequestID:
      description: Server-generated request identifier. It is safe to share with support and appears in server logs.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying the request.
      schema:
        type: string
        example: "60"
    SetCookie:
      description: May contain one or more Set-Cookie headers (session or CSRF cookies).
      schema:
        type: string
  responses:
    NotFound:
      description: Resource does not exist or is outside the user's memberships.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid JSON, unknown fields, invalid email/password/name, or invalid pagination.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or revoked session.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Origin or CSRF validation failed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Email is already registered. The message is intentionally generic to reduce account enumeration.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body exceeds 8192 bytes.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content-Type is not application/json.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Persistent IP or email authentication rate limit exceeded.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server or database failure. Share the request ID, not credentials or message content.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: The request exceeded the 15-second server timeout.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Database is unavailable; the readiness probe cannot serve traffic.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PublicFeatureMode:
      type: string
      enum: [active, mock, disabled, unavailable]
    PublicStatus:
      type: object
      additionalProperties: false
      required: [checked_at, api, database, features, live_provider_connected, payments_connected]
      properties:
        checked_at:
          type: string
          format: date-time
        api:
          type: boolean
        database:
          type: boolean
        live_provider_connected:
          type: boolean
        payments_connected:
          type: boolean
        features:
          type: object
          additionalProperties: false
          required: [identity, catalog, numbers, messaging, billing]
          properties:
            identity:
              $ref: "#/components/schemas/PublicFeatureMode"
            catalog:
              $ref: "#/components/schemas/PublicFeatureMode"
            numbers:
              $ref: "#/components/schemas/PublicFeatureMode"
            messaging:
              $ref: "#/components/schemas/PublicFeatureMode"
            billing:
              $ref: "#/components/schemas/PublicFeatureMode"
    Wallet:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["currency", "available_minor", "reserved_minor"],
        "properties":
          {
            "currency": { "type": "string", "enum": ["USD"] },
            "available_minor": { "type": "integer", "format": "int64" },
            "reserved_minor": { "type": "integer", "format": "int64" },
          },
      }
    WorkspaceCounts:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["numbers", "unread_messages", "completed_orders"],
        "properties":
          {
            "numbers": { "type": "integer", "format": "int64" },
            "unread_messages": { "type": "integer", "format": "int64" },
            "completed_orders": { "type": "integer", "format": "int64" },
          },
      }
    LeasedNumber:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "id",
            "e164",
            "status",
            "country_code",
            "number_type",
            "capabilities",
            "monthly_fee_minor",
            "started_at",
            "expires_at",
            "order_id",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "e164": { "type": "string" },
            "status":
              { "type": "string", "enum": ["active", "released", "expired"] },
            "country_code": { "type": "string" },
            "number_type": { "type": "string" },
            "capabilities": { "type": "array", "items": { "type": "string" } },
            "monthly_fee_minor": { "type": "integer", "format": "int64" },
            "started_at": { "type": "string", "format": "date-time" },
            "expires_at": { "type": "string", "format": "date-time" },
            "order_id": { "type": "string" },
          },
      }
    WorkspaceOrder:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "id",
            "e164",
            "status",
            "purpose",
            "amount_minor",
            "failure_code",
            "created_at",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "e164": { "type": "string" },
            "status":
              {
                "type": "string",
                "enum": ["completed", "failed", "refunded", "processing"],
              },
            "purpose": { "type": "string" },
            "amount_minor": { "type": "integer", "format": "int64" },
            "failure_code": { "type": "string" },
            "created_at": { "type": "string", "format": "date-time" },
          },
      }
    LedgerEntry:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "id",
            "reference_id",
            "kind",
            "available_delta",
            "reserved_delta",
            "available_after",
            "reserved_after",
            "created_at",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "reference_id": { "type": "string" },
            "kind":
              {
                "type": "string",
                "enum":
                  ["mock_credit", "payment_credit", "reserve", "settle", "release", "refund"],
              },
            "available_delta": { "type": "integer", "format": "int64" },
            "reserved_delta": { "type": "integer", "format": "int64" },
            "available_after": { "type": "integer", "format": "int64" },
            "reserved_after": { "type": "integer", "format": "int64" },
            "created_at": { "type": "string", "format": "date-time" },
          },
      }
    WorkspaceMessage:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          ["id", "lease_id", "e164", "received_at", "expires_at", "read"],
        "properties":
          {
            "id": { "type": "string" },
            "lease_id": { "type": "string" },
            "e164": { "type": "string" },
            "received_at": { "type": "string", "format": "date-time" },
            "expires_at": { "type": "string", "format": "date-time" },
            "read": { "type": "boolean" },
            "body": { "type": "string" },
          },
      }
    WorkspaceEvent:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "type", "resource_id"],
        "properties":
          {
            "id": { "type": "integer", "format": "int64" },
            "type": { "type": "string" },
            "resource_id": { "type": "string" },
          },
      }
    WorkspaceCommand:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties":
          {
            "amount_minor": { "type": "integer", "format": "int64" },
            "catalog_item_id": { "type": "string" },
            "purpose":
              {
                "type": "string",
                "enum":
                  [
                    "customer_support",
                    "product_notifications",
                    "service_testing",
                  ],
              },
            "confirmed_terms": { "type": "boolean" },
            "simulate_failure": { "type": "boolean" },
            "lease_id": { "type": "string" },
            "body": { "type": "string" },
          },
      }
    ProviderIncoming:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "lease_id", "body", "occurred_at"],
        "properties":
          {
            "id": { "type": "string" },
            "lease_id": { "type": "string" },
            "body": { "type": "string" },
            "occurred_at": { "type": "string", "format": "date-time" },
          },
      }
    ProviderAcknowledgement:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["status"],
        "properties": { "status": { "type": "string" } },
      }
    PaymentOrder:
      type: object
      additionalProperties: false
      required: [id, reference, amount_minor, currency, provider, status, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        amount_minor: {type: integer, format: int64, minimum: 100, maximum: 1000000}
        currency: {type: string, enum: [USD]}
        provider: {type: string, enum: [mock]}
        status: {type: string, enum: [pending, succeeded, failed, canceled, expired]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    WorkspaceResult:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "status"],
        "properties":
          {
            "id": { "type": "string" },
            "status": { "type": "string" },
            "order": { "$ref": "#/components/schemas/WorkspaceOrder" },
            "number": { "$ref": "#/components/schemas/LeasedNumber" },
            "payment": {"$ref":"#/components/schemas/PaymentOrder"},
            "wallet": { "$ref": "#/components/schemas/Wallet" },
          },
      }
    CatalogItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          e164,
          country_code,
          country_name,
          region,
          number_type,
          capabilities,
          provider,
          source,
          currency,
          monthly_fee_minor,
          inbound_sms_fee_micros,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        e164: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        country_name: { type: string }
        region: { type: string }
        number_type: { type: string, enum: [mobile, local, toll_free] }
        capabilities:
          type: array
          minItems: 1
          items: { type: string, enum: [sms, voice, mms] }
        provider: { type: string, enum: [NumDock Mock] }
        source: { type: string, enum: [mock] }
        currency: { type: string, enum: [USD] }
        monthly_fee_minor:
          type: integer
          format: int32
          minimum: 0
          description: Monthly demonstration price in minor currency units (USD cents).
        inbound_sms_fee_micros:
          type: integer
          format: int32
          minimum: 0
          description: Demonstration price per inbound SMS in millionths of one USD. Not a charge.
        status: { type: string, enum: [available] }
    CatalogList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset, mode]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
        total: { type: integer, format: int64, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0, maximum: 2147483647 }
        mode: { type: string, enum: [mock, disabled] }
    OverviewTotals:
      type: object
      additionalProperties: false
      required:
        [
          active_numbers,
          messages_received,
          messages_failed,
          orders_completed,
          spend_minor,
        ]
      properties:
        active_numbers: { type: integer, format: int64, minimum: 0 }
        messages_received: { type: integer, format: int64, minimum: 0 }
        messages_failed: { type: integer, format: int64, minimum: 0 }
        orders_completed: { type: integer, format: int64, minimum: 0 }
        spend_minor: { type: integer, format: int64, minimum: 0 }
    OverviewDay:
      type: object
      additionalProperties: false
      required:
        [
          date,
          active_numbers,
          messages_received,
          messages_failed,
          orders_completed,
          spend_minor,
        ]
      properties:
        date: { type: string, format: date }
        active_numbers: { type: integer, format: int64, minimum: 0 }
        messages_received: { type: integer, format: int64, minimum: 0 }
        messages_failed: { type: integer, format: int64, minimum: 0 }
        orders_completed: { type: integer, format: int64, minimum: 0 }
        spend_minor: { type: integer, format: int64, minimum: 0 }
    OverviewTelemetry:
      type: object
      additionalProperties: false
      required: [instrumented, exporter_configured]
      properties:
        instrumented: { type: boolean }
        exporter_configured: { type: boolean }
    Overview:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          mode,
          currency,
          days,
          range_start,
          range_end,
          seeded_at,
          totals,
          series,
          telemetry,
        ]
      properties:
        organization_id: { type: string, format: uuid }
        mode: { type: string, enum: [mock, empty, disabled] }
        currency: { type: string, enum: [USD] }
        days: { type: integer, enum: [7, 30] }
        range_start: { type: string, format: date }
        range_end: { type: string, format: date }
        seeded_at: { type: string, format: date-time, nullable: true }
        totals:
          $ref: "#/components/schemas/OverviewTotals"
        series:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/OverviewDay"
        telemetry:
          $ref: "#/components/schemas/OverviewTelemetry"
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, ready]
    ErrorCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - resource_limit
        - feature_disabled
        - forbidden
        - idempotency_conflict
        - inventory_unavailable
        - insufficient_balance
        - lease_inactive
        - refund_unavailable
        - release_required
        - sms_unavailable
        - validation_failed
        - invalid_request
        - unsupported_media_type
        - payload_too_large
        - csrf_failed
        - account_unavailable
        - invalid_credentials
        - unauthenticated
        - rate_limited
        - not_found
        - method_not_allowed
        - not_ready
        - request_timeout
        - internal_error
      example: validation_failed
    Error:
      type: object
      required: [code, message, request_id]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: User-safe message. Do not parse this field for control flow; use code.
          example: Enter a valid email address.
        request_id:
          type: string
          description: Correlates this response with server logs.
          example: 3d4f6a9b2c1e4f67890a1b
    CSRFToken:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Send this value in the X-CSRF-Token header; it must match the CSRF cookie.
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Lowercased and trimmed before lookup.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 12–128 Unicode code points; spaces are allowed.
      example:
        email: alex@example.com
        password: a sufficiently long passphrase
    Registration:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 100
        organization_name:
          type: string
          minLength: 1
          maxLength: 100
      example:
        email: alex@example.com
        password: a sufficiently long passphrase
        name: Alex
        organization_name: Alpha
    User:
      type: object
      required: [id, email, name, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
      example:
        id: 4d9e54b0-7e4b-4f97-9a2f-5d9e0c5b4a21
        email: alex@example.com
        name: Alex
        created_at: "2026-10-20T12:00:00Z"
    Organization:
      type: object
      required: [id, name, slug, role, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          description: Stable unique organization handle for browser URLs; never an authorization credential.
        role:
          type: string
          enum: [owner, admin, member]
        created_at:
          type: string
          format: date-time
      example:
        id: 6c72da79-7c19-49a9-95c9-18d979051b3f
        name: Alpha
        slug: alpha-a6c1e2f31148b902
        role: owner
        created_at: "2026-10-20T12:00:00Z"
    Identity:
